name: Entitlements and mobile checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pigeonsub_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: backend
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run test:backend
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/pigeonsub_tests
